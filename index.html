<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a3d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Golf GPS" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>Golf GPS</title>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <p class="brand" id="courseName">Golf GPS</p>
        <p class="hole-label" id="holeLabel">Hole 1</p>
      </header>

      <section class="distance-block">
        <p class="distance" id="distanceMid">—</p>
        <p class="label">yards to middle</p>
        <div class="pin-row">
          <div>
            <span class="pin-val" id="distanceFront">—</span>
            <span class="pin-name">Front</span>
          </div>
          <div>
            <span class="pin-val" id="distanceBack">—</span>
            <span class="pin-name">Back</span>
          </div>
        </div>
      </section>

      <div class="hole-nav">
        <button type="button" class="nav-btn" id="prevHole">Prev</button>
        <button type="button" class="nav-btn" id="nextHole">Next</button>
      </div>

      <section class="score-entry">
        <p class="score-meta" id="holeMeta">Par 4 · 343 yd</p>
        <div class="score-controls">
          <button type="button" class="score-btn" id="scoreMinus" aria-label="Lower score">
            −
          </button>
          <p class="score-value" id="scoreValue">—</p>
          <button type="button" class="score-btn" id="scorePlus" aria-label="Raise score">
            +
          </button>
        </div>
        <p class="label">my score</p>
      </section>

      <p class="status" id="status">Waiting for GPS…</p>
      <button type="button" class="gps-btn" id="refreshGps">Refresh GPS</button>

      <section class="scorecard" aria-label="Scorecard">
        <div class="scorecard-head">
          <span>Scorecard</span>
          <span id="roundTotal">—</span>
        </div>
        <div class="scorecard-grid" id="scorecard"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>

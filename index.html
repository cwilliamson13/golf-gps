<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a3d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Golf GPS" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>Golf GPS</title>
  </head>
  <body>
    <main class="shell" id="playView">
      <div class="play-area">
        <header class="top">
          <div class="top-left">
            <p class="brand" id="courseName">Golf GPS</p>
            <p class="hole-label" id="holeLabel">Hole 1</p>
            <div class="hole-score-wrap">
              <p class="hole-score-label">This Hole</p>
              <p class="hole-score" id="holeScore">—</p>
            </div>
            <p class="hole-meta" id="holeMeta">Hcp 4 · 343 yd</p>
            <button type="button" class="tee-open" id="teeOpen">Blue tees</button>
            <p class="gps-status" id="status">Waiting for GPS…</p>
          </div>
          <div class="top-right">
            <p class="round-total" id="roundTotal">—</p>
            <p class="to-par" id="toPar">E</p>
          </div>
        </header>

        <section class="distance-block">
          <p class="distance" id="distanceMid">—</p>
          <p class="label">yards to middle</p>
          <div class="pin-row">
            <div>
              <span class="pin-val" id="distanceFront">—</span>
              <span class="pin-name">Front</span>
            </div>
            <div>
              <span class="pin-val" id="distanceBack">—</span>
              <span class="pin-name">Back</span>
            </div>
          </div>
        </section>

        <div class="controls">
          <div class="score-quick" role="group" aria-label="Quick score">
            <button type="button" class="score-quick-btn" data-score-action="dec">−</button>
            <button type="button" class="score-quick-btn" data-score-action="birdie">−1</button>
            <button type="button" class="score-quick-btn" data-score-action="par">E</button>
            <button type="button" class="score-quick-btn" data-score-action="bogey">+1</button>
            <button type="button" class="score-quick-btn" data-score-action="double">+2</button>
            <button type="button" class="score-quick-btn" data-score-action="inc">+</button>
          </div>
          <div class="hole-nav">
            <button type="button" class="nav-btn" id="prevHole">Prev</button>
            <button type="button" class="nav-btn" id="nextHole">Next</button>
          </div>
        </div>
      </div>

      <section class="scorecard" id="scorecardSection" aria-label="Scorecard">
        <div class="scorecard-bar">
          <button type="button" class="scorecard-toggle" id="scorecardToggle">
            <span>Scorecard</span>
            <span id="scorecardChevron">▾</span>
          </button>
          <button type="button" class="summary-link" id="openSummary" hidden>
            Summary
          </button>
          <button type="button" class="clear-round" id="clearRound">Clear round</button>
        </div>
        <div class="scorecard-grid" id="scorecard"></div>
      </section>
    </main>

    <section class="summary" id="summaryView" hidden>
      <div class="summary-inner">
        <p class="summary-kicker" id="summaryCourse">Round complete</p>
        <p class="summary-total" id="summaryTotal">—</p>
        <p class="summary-topar" id="summaryToPar">E</p>
        <div class="summary-head">
          <span>Hole</span><span>Par</span><span>Score</span><span>Tot</span><span>+/−</span>
        </div>
        <div class="summary-holes" id="summaryHoles"></div>
        <div class="summary-actions">
          <button type="button" class="nav-btn" id="summaryShare">Copy summary</button>
          <button type="button" class="nav-btn" id="summaryClose">Back</button>
          <button type="button" class="nav-btn summary-new" id="summaryNewRound">
            New round
          </button>
        </div>
      </div>
    </section>

    <div class="pad" id="teePad" hidden>
      <div class="pad-sheet">
        <p class="pad-title">Select tee</p>
        <div class="tee-options" id="teeOptions"></div>
        <button type="button" class="pad-action pad-done" id="teeClose">Done</button>
      </div>
    </div>

    <div class="pad" id="scorePad" hidden>
      <div class="pad-sheet">
        <p class="pad-title" id="padTitle">Hole 1</p>
        <p class="pad-value" id="padValue">—</p>
        <div class="pad-keys" id="padKeys"></div>
        <div class="pad-actions">
          <button type="button" class="pad-action" id="padClear">Clear</button>
          <button type="button" class="pad-action pad-done" id="padDone">Done</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
